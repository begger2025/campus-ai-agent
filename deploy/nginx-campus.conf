# 校声智枢 Nginx 站点配置
# 放置：/etc/nginx/sites-available/campus  → ln -s 到 sites-enabled/
# 职责：Nginx 作为唯一公网入口 —— 直接服务前端静态产物，把 /api 与 /uploads 反代给本机 uvicorn。
# 前端 axios baseURL 是相对路径 /api，与站点同源 → 零 CORS、无需改任何前端配置。

server {
    listen 80;
    # 部署后改成你的公网 IP 或已备案域名；IP 直连填 _ 即匹配所有 host
    server_name _;

    # 前端静态产物（vite build 输出）
    root /opt/campus-ai-agent/frontend/dist;
    index index.html;

    # 前端上传体积（投稿图片经后端，这里给富余）
    client_max_body_size 12m;

    # 静态资源缓存（vite 产物带 hash，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由：找不到的路径回退 index.html，交给 vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 业务接口反代到本机 uvicorn（仅监听 127.0.0.1，不对公网暴露）
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 调用可能较慢（对话/预审经中转站），放宽读超时，与前端请求级超时对齐
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # 投稿图片：后端 StaticFiles 挂在 /uploads，反代过去
    location /uploads/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        expires 7d;
    }
}

# ── HTTPS 附录（有已备案域名后启用）──────────────────────────────
# 拿到域名并完成 ICP 备案后：
#   sudo certbot --nginx -d your-domain.com
# certbot 会自动改写本文件，加 443 server 块与 80→443 跳转。
```
